[project]
name = "ari-show-scripts"
version = "0.1.0"
description = "data/conferences.yml から README の Conferences セクションを生成・追加するスクリプト"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff 固有
]
ignore = [
    "RUF001", "RUF002", "RUF003", # 全角の括弧や記号を日本語の文中で使うため
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
