name: README check

# data/conferences.yml と README.md の Conferences セクションがずれていないか確認します。
# ずれていたら `uv run scripts/build_readme.py` を実行してコミットしてください。

on:
  pull_request:
    paths: ["data/**", "scripts/**", "README.md"]
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", "README.md"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run scripts/build_readme.py --check
