# カンファレンス参加履歴の唯一の正 (single source of truth)
#
# README の Conferences セクションはこのファイルから自動生成されます。
# 追加は次のどちらかで:
#   - ローカル:  uv run scripts/add_conference.py        (質問に答えるだけ。--pr で PR 作成まで)
#   - GitHub:   Actions → "Add conference" → Run workflow (フォーム入力 → PR が自動で作られる)
#
# フィールド:
#   name  : カンファレンス名 (必須)
#   url   : リンク先 (必須)
#   date  : 開催日 YYYY-MM-DD。複数日なら初日 (必須)
#   end   : 最終日 YYYY-MM-DD。複数日開催のとき (任意)
#   roles : 役割のリスト (必須, 1つ以上)
#             speaker  = 登壇者
#             core     = コアスタッフ
#             staff    = 当日スタッフ
#             noc      = NOC
#             attendee = 参加者
#   note  : 補足。登壇タイトル、記事やスライドへのリンクなど (任意)
#           Markdown のリンク記法 [text](url) が使えます

